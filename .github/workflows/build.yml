name: Build AEGIS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build AEGIS Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            patchelf

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer
          python -m pip install cython==0.29.37

      - name: Prepare Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses || true

          echo "Installing Android SDK components..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK installation complete."

      - name: Verify Android SDK
        run: |
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          echo ""
          echo "AIDL:"
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print || true

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo "=========================================="

      - name: Build AEGIS APK
        working-directory: android_app
        run: |
          echo "=========================================="
          echo "BUILDING AEGIS APK"
          echo "=========================================="

          buildozer -v android debug

      - name: Show APK output
        if: always()
        run: |
          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          if [ -d "android_app/bin" ]; then
            find android_app/bin -type f -print
          else
            echo "No APK output directory found."
          fi

      - name: Upload AEGIS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
