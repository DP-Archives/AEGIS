name: Build AEGIS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build AEGIS Android APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # LINUX DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            patchelf


      # ============================================================
      # INSTALL BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade buildozer
          python -m pip install cython==0.29.37

          buildozer --version


      # ============================================================
      # PREPARE BUILDOZER ANDROID SDK DIRECTORY
      # ============================================================

      - name: Prepare Buildozer Android SDK
        run: |

          echo "=========================================="
          echo "PREPARING BUILDOZER ANDROID SDK"
          echo "=========================================="

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          echo "$SDK"

          mkdir -p "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$HOME"

          echo "Downloading Android command line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-cmdline-tools.zip

          echo "Extracting..."

          unzip -q android-cmdline-tools.zip \
            -d "$SDK/cmdline-tools"

          mv "$SDK/cmdline-tools/cmdline-tools" \
             "$SDK/cmdline-tools/latest"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo ""
          echo "sdkmanager version:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version


      # ============================================================
      # ACCEPT LICENSES
      # ============================================================

      - name: Accept Android licenses
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ACCEPTING ANDROID LICENSES"
          echo "=========================================="

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true


      # ============================================================
      # INSTALL REQUIRED ANDROID COMPONENTS
      # ============================================================

      - name: Install Android components
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "INSTALLING ANDROID COMPONENTS"
          echo "=========================================="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo ""
          echo "Installed components:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed


      # ============================================================
      # VERIFY AIDL
      # ============================================================

      - name: Verify Build Tools and AIDL
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "VERIFYING AIDL"
          echo "=========================================="

          echo ""
          echo "Build Tools directory:"

          ls -la "$SDK/build-tools"

          echo ""
          echo "AIDL files:"

          find "$SDK/build-tools" \
            -name "aidl" \
            -type f \
            -print

          echo ""
          echo "Testing AIDL..."

          "$SDK/build-tools/34.0.0/aidl" --version

          echo ""
          echo "AIDL TEST PASSED."


      # ============================================================
      # BUILD AEGIS
      # ============================================================

      - name: Build AEGIS APK
        working-directory: android_app
        run: |

          echo "=========================================="
          echo "BUILDING AEGIS APK"
          echo "=========================================="

          buildozer -v android debug


      # ============================================================
      # SHOW OUTPUT
      # ============================================================

      - name: Show APK output
        if: always()
        run: |

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          if [ -d "android_app/bin" ]; then

            find android_app/bin \
              -type f \
              -print

          else

            echo "No APK output directory found."

          fi


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload AEGIS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
