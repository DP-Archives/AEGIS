name: Build AEGIS APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build AEGIS Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON 3.11
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # INSTALL SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            patchelf \
            gettext \
            wget


      # ============================================================
      # INSTALL BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install \
            "buildozer==1.5.0"

          python -m pip install \
            "cython==0.29.37"

          echo "=========================================="
          echo "BUILDOZER VERSION"
          echo "=========================================="

          buildozer --version


      # ============================================================
      # CLEAN BUILDOZER
      # ============================================================

      - name: Clean Buildozer environment
        run: |
          rm -rf "$HOME/.buildozer"

          mkdir -p "$HOME/.buildozer"

          echo "Buildozer directory cleaned."


      # ============================================================
      # CONFIGURE PYTHON-FOR-ANDROID
      # ============================================================

      - name: Configure python-for-android
        run: |

          echo "=========================================="
          echo "CONFIGURING PYTHON-FOR-ANDROID"
          echo "=========================================="

          echo "PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE=0" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r25b" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=34" >> "$GITHUB_ENV"

          echo "ANDROIDNDKVER=r25b" >> "$GITHUB_ENV"


      # ============================================================
      # PREPARE BUILDOZER / PYTHON-FOR-ANDROID
      # ============================================================

      - name: Prepare Android toolchain
        working-directory: android_app
        run: |

          echo "=========================================="
          echo "PREPARING ANDROID TOOLCHAIN"
          echo "=========================================="

          buildozer android p4a -- --help


      # ============================================================
      # VERIFY AIDL
      # ============================================================

      - name: Verify Android AIDL
        run: |

          echo "=========================================="
          echo "SEARCHING FOR AIDL"
          echo "=========================================="

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Android SDK:"
          echo "$SDK"

          echo ""
          echo "Searching for AIDL..."

          AIDL_PATH=$(find "$SDK/build-tools" \
            -type f \
            -name "aidl" \
            2>/dev/null | head -n 1 || true)

          if [ -z "$AIDL_PATH" ]; then
            echo ""
            echo "ERROR: AIDL was not installed."
            echo ""
            echo "Contents of Android SDK:"
            find "$SDK" -maxdepth 3 -type f | head -n 100 || true
            exit 1
          fi

          echo ""
          echo "AIDL FOUND:"
          echo "$AIDL_PATH"

          echo ""
          echo "AIDL permissions:"
          ls -lh "$AIDL_PATH"

          echo ""
          echo "AIDL file information:"
          file "$AIDL_PATH"


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build AEGIS APK
        working-directory: android_app
        run: |

          echo "=========================================="
          echo "STARTING AEGIS APK BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ============================================================
      # SHOW OUTPUT
      # ============================================================

      - name: Show APK output
        if: always()
        run: |

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          if [ -d "android_app/bin" ]; then

            find android_app/bin \
              -type f \
              -print

          else

            echo "android_app/bin does not exist."

          fi


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload AEGIS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
