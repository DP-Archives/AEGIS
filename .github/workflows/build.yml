name: Build AEGIS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build AEGIS Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            patchelf \
            wget


      # ============================================================
      # INSTALL BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install \
            "buildozer==1.5.0"

          python -m pip install \
            "cython==0.29.37"

          echo ""
          echo "Buildozer version:"
          buildozer --version


      # ============================================================
      # CLEAN OLD BUILDOZER CACHE
      # ============================================================

      - name: Clean Buildozer cache
        run: |
          rm -rf "$HOME/.buildozer"

          mkdir -p "$HOME/.buildozer"


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build AEGIS APK
        working-directory: android_app
        run: |

          echo "=========================================="
          echo "STARTING AEGIS ANDROID BUILD"
          echo "=========================================="

          buildozer -v android debug


      # ============================================================
      # SHOW BUILD OUTPUT
      # ============================================================

      - name: Show APK output
        if: always()
        run: |

          echo "=========================================="
          echo "AEGIS APK OUTPUT"
          echo "=========================================="

          if [ -d "android_app/bin" ]; then
            find android_app/bin \
              -type f \
              -print
          else
            echo "No APK directory found."
          fi


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload AEGIS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
