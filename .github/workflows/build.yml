name: Build AEGIS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build AEGIS Android APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # LINUX DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            patchelf


      # ============================================================
      # PYTHON BUILD TOOLS
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade buildozer
          python -m pip install cython==0.29.37


      # ============================================================
      # ANDROID SDK COMMAND LINE TOOLS
      # ============================================================

      - name: Install Android SDK command line tools
        run: |

          echo "=========================================="
          echo "INSTALLING ANDROID SDK COMMAND LINE TOOLS"
          echo "=========================================="

          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd "$HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip \
            -d "$HOME/android-sdk/cmdline-tools"

          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" \
             "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

          echo ""
          echo "SDK location:"
          echo "$HOME/android-sdk"

          echo ""
          echo "sdkmanager:"
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --version


      # ============================================================
      # ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        run: |

          echo "=========================================="
          echo "ACCEPTING ANDROID SDK LICENSES"
          echo "=========================================="

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true


      # ============================================================
      # INSTALL ANDROID COMPONENTS
      # ============================================================

      - name: Install Android SDK components
        run: |

          echo "=========================================="
          echo "INSTALLING ANDROID SDK COMPONENTS"
          echo "=========================================="

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo ""
          echo "Installed Android components:"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed


      # ============================================================
      # VERIFY AIDL
      # ============================================================

      - name: Verify AIDL
        run: |

          echo "=========================================="
          echo "CHECKING AIDL"
          echo "=========================================="

          AIDL="$ANDROID_SDK_ROOT/build-tools/34.0.0/aidl"

          if [ -f "$AIDL" ]; then
            echo "AIDL FOUND:"
            echo "$AIDL"

            chmod +x "$AIDL" || true

            "$AIDL" --version || true
          else
            echo "ERROR: AIDL NOT FOUND"
            exit 1
          fi


      # ============================================================
      # BUILD AEGIS APK
      # ============================================================

      - name: Build AEGIS APK
        working-directory: android_app
        run: |

          echo "=========================================="
          echo "BUILDING AEGIS APK"
          echo "=========================================="

          buildozer -v android debug


      # ============================================================
      # SHOW OUTPUT
      # ============================================================

      - name: Show APK output
        if: always()
        run: |

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          if [ -d "android_app/bin" ]; then
            find android_app/bin -type f -print
          else
            echo "No APK output directory found."
          fi


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload AEGIS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
